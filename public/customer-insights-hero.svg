<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Customer Insights data flow</title>
  <desc>Calls, support tickets, Slack messages, CRM data, and internal notes flow into a shared customer intelligence layer with an entity graph, embeddings, and hybrid search. Teams access the result through web chat, MCP, dashboards, and reports.</desc>
  <defs>
    <linearGradient id="page" x1="96" y1="72" x2="1504" y2="828" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAF8FF"/>
      <stop offset="0.52" stop-color="#F8F8FA"/>
      <stop offset="1" stop-color="#FFF9F4"/>
    </linearGradient>
    <linearGradient id="engine" x1="660" y1="410" x2="950" y2="676" gradientUnits="userSpaceOnUse">
      <stop stop-color="#232326"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="graphGlow" x1="696" y1="444" x2="924" y2="634" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C5A7F5" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#ED20B7" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FF4B00" stop-opacity="0.14"/>
    </linearGradient>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#18181B" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18181B" flood-opacity="0.06"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#18181B" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#18181B" flood-opacity="0.05"/>
    </filter>
    <filter id="hubGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1L8 5L1 9" stroke="#A1A1AA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.25" fill="#18181B" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="110" cy="90" r="116" fill="#C5A7F5" fill-opacity="0.10"/>
  <circle cx="1494" cy="820" r="156" fill="#FF4B00" fill-opacity="0.07"/>
  <circle cx="1510" cy="108" r="86" fill="#ED20B7" fill-opacity="0.06"/>

  <text x="800" y="76" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="700" letter-spacing="-1.1">Every customer signal, one intelligence layer</text>
  <text x="800" y="110" text-anchor="middle" fill="#71717A" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Connect what customers say, what they do, and what your team knows.</text>

  <text x="88" y="190" fill="#A1A1AA" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="700" letter-spacing="2">PRIVATE DATA SOURCES</text>
  <text x="1126" y="190" fill="#A1A1AA" font-family="Inter, ui-sans-serif, system-ui" font-size="11" font-weight="700" letter-spacing="2">HOW YOUR TEAM USES IT</text>

  <!-- Source flows -->
  <g stroke-linecap="round" fill="none">
    <path d="M374 257C466 257 480 380 574 426" stroke="#BCA6E7" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M374 363C466 363 492 416 574 444" stroke="#FF9A70" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M374 469C462 469 492 468 574 462" stroke="#EC79CB" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M374 575C466 575 492 518 574 480" stroke="#7FC9B1" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M374 681C466 681 480 555 574 498" stroke="#81A9EC" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Source cards -->
  <g filter="url(#cardShadow)">
    <rect x="88" y="218" width="286" height="78" rx="18" fill="white"/>
    <rect x="88" y="324" width="286" height="78" rx="18" fill="white"/>
    <rect x="88" y="430" width="286" height="78" rx="18" fill="white"/>
    <rect x="88" y="536" width="286" height="78" rx="18" fill="white"/>
    <rect x="88" y="642" width="286" height="78" rx="18" fill="white"/>
  </g>
  <g stroke="#18181B" stroke-opacity="0.08">
    <rect x="88.5" y="218.5" width="285" height="77" rx="17.5"/>
    <rect x="88.5" y="324.5" width="285" height="77" rx="17.5"/>
    <rect x="88.5" y="430.5" width="285" height="77" rx="17.5"/>
    <rect x="88.5" y="536.5" width="285" height="77" rx="17.5"/>
    <rect x="88.5" y="642.5" width="285" height="77" rx="17.5"/>
  </g>

  <!-- Calls icon -->
  <rect x="108" y="237" width="40" height="40" rx="12" fill="#F1EAFE"/>
  <g stroke="#7C3AED" stroke-width="2" stroke-linecap="round">
    <path d="M119 257H122L125 249L130 266L133 254L136 260H139"/>
  </g>
  <text x="166" y="251" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Calls &amp; transcripts</text>
  <text x="166" y="272" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">What customers say in meetings</text>

  <!-- Tickets icon -->
  <rect x="108" y="343" width="40" height="40" rx="12" fill="#FFF0EA"/>
  <path d="M119 353H137V373H119V353Z" stroke="#EA580C" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M123 359H133M123 364H133M123 369H129" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
  <text x="166" y="357" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Support tickets</text>
  <text x="166" y="378" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Problems, requests, and urgency</text>

  <!-- Slack icon -->
  <rect x="108" y="449" width="40" height="40" rx="12" fill="#FDEAF7"/>
  <path d="M122 458V480M134 458V480M117 465H139M117 474H139" stroke="#DB1A9E" stroke-width="2" stroke-linecap="round"/>
  <text x="166" y="463" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Slack messages</text>
  <text x="166" y="484" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Signals shared across your team</text>

  <!-- CRM icon -->
  <rect x="108" y="555" width="40" height="40" rx="12" fill="#EAF8F3"/>
  <path d="M119 582V569M128 582V561M137 582V565" stroke="#059669" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M117 583H140" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
  <text x="166" y="569" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">CRM &amp; revenue</text>
  <text x="166" y="590" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Accounts, deals, and growth</text>

  <!-- Notes icon -->
  <rect x="108" y="661" width="40" height="40" rx="12" fill="#ECF3FF"/>
  <path d="M120 671H136V691H120V671Z" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M124 677H132M124 682H132M124 687H129" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/>
  <text x="166" y="675" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="14" font-weight="700">Notes &amp; documents</text>
  <text x="166" y="696" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Context that lives with your team</text>

  <!-- Input hub -->
  <circle cx="590" cy="462" r="32" fill="#C5A7F5" fill-opacity="0.34" filter="url(#hubGlow)"/>
  <circle cx="590" cy="462" r="17" fill="#18181B"/>
  <path d="M583 462H597M590 455V469" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <path d="M607 462H630" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Core intelligence panel -->
  <g filter="url(#panelShadow)">
    <rect x="630" y="198" width="420" height="548" rx="38" fill="white"/>
  </g>
  <rect x="630.5" y="198.5" width="419" height="547" rx="37.5" stroke="#18181B" stroke-opacity="0.09"/>

  <rect x="772" y="224" width="136" height="82" rx="22" fill="#FAFAFA"/>
  <image href="together-logo.png" x="808" y="236" width="64" height="64" preserveAspectRatio="xMidYMid meet"/>
  <text x="840" y="338" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="750">Customer Insights</text>
  <text x="840" y="364" text-anchor="middle" fill="#71717A" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Your shared customer intelligence layer</text>

  <rect x="662" y="394" width="356" height="272" rx="26" fill="url(#engine)"/>
  <rect x="662.5" y="394.5" width="355" height="271" rx="25.5" stroke="white" stroke-opacity="0.08"/>
  <ellipse cx="840" cy="520" rx="139" ry="104" fill="url(#graphGlow)"/>

  <text x="686" y="425" fill="#A1A1AA" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="700" letter-spacing="1.4">SEARCH ACROSS EVERY ENTITY</text>

  <!-- Entity graph -->
  <g stroke="#71717A" stroke-opacity="0.72" stroke-width="1.4">
    <path d="M840 506L758 463M840 506L926 462M840 506L754 551M840 506L931 553M840 506L840 592"/>
    <path d="M758 463L754 551M926 462L931 553M754 551L840 592M931 553L840 592" stroke-opacity="0.34"/>
  </g>
  <circle cx="840" cy="506" r="34" fill="white"/>
  <text x="840" y="502" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="700">COMPANY</text>
  <text x="840" y="517" text-anchor="middle" fill="#71717A" font-family="Inter, ui-sans-serif, system-ui" font-size="9">Acme</text>

  <circle cx="758" cy="463" r="25" fill="#C5A7F5"/>
  <text x="758" y="467" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">PEOPLE</text>
  <circle cx="926" cy="462" r="25" fill="#ED20B7"/>
  <text x="926" y="466" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">TOPICS</text>
  <circle cx="754" cy="551" r="25" fill="#FF8A57"/>
  <text x="754" y="555" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">RISKS</text>
  <circle cx="931" cy="553" r="25" fill="#7FC9B1"/>
  <text x="931" y="557" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">DEALS</text>
  <circle cx="840" cy="592" r="25" fill="#81A9EC"/>
  <text x="840" y="596" text-anchor="middle" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="9" font-weight="700">EVENTS</text>

  <!-- Search layer labels -->
  <rect x="676" y="620" width="98" height="28" rx="9" fill="white" fill-opacity="0.10"/>
  <text x="725" y="638" text-anchor="middle" fill="white" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="600">Embeddings</text>
  <rect x="782" y="620" width="116" height="28" rx="9" fill="white" fill-opacity="0.10"/>
  <text x="840" y="638" text-anchor="middle" fill="white" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="600">Hybrid search</text>
  <rect x="906" y="620" width="98" height="28" rx="9" fill="white" fill-opacity="0.10"/>
  <text x="955" y="638" text-anchor="middle" fill="white" font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="600">Citations</text>

  <g font-family="Inter, ui-sans-serif, system-ui" font-size="10" font-weight="700">
    <rect x="674" y="690" width="104" height="30" rx="10" fill="#F4F4F5"/>
    <circle cx="690" cy="705" r="4" fill="#22C55E"/>
    <text x="704" y="709" fill="#52525B">Authenticated</text>
    <rect x="788" y="690" width="96" height="30" rx="10" fill="#F4F4F5"/>
    <circle cx="804" cy="705" r="4" fill="#7C3AED"/>
    <text x="818" y="709" fill="#52525B">Extensible</text>
    <rect x="894" y="690" width="112" height="30" rx="10" fill="#F4F4F5"/>
    <circle cx="910" cy="705" r="4" fill="#18181B"/>
    <text x="924" y="709" fill="#52525B">Private by default</text>
  </g>

  <!-- Output hub and flows -->
  <path d="M1050 462H1080" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="1096" cy="462" r="17" fill="#18181B"/>
  <path d="M1089 462H1103M1096 455V469" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="1096" cy="462" r="32" fill="#FF4B00" fill-opacity="0.20" filter="url(#hubGlow)"/>

  <g stroke-linecap="round" fill="none">
    <path d="M1113 450C1156 420 1154 286 1200 286" stroke="#A1A1AA" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1113 462H1200" stroke="#A1A1AA" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M1113 474C1156 504 1154 638 1200 638" stroke="#A1A1AA" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- Output cards -->
  <g filter="url(#cardShadow)">
    <rect x="1210" y="234" width="302" height="104" rx="22" fill="white"/>
    <rect x="1210" y="410" width="302" height="104" rx="22" fill="white"/>
    <rect x="1210" y="586" width="302" height="104" rx="22" fill="white"/>
  </g>
  <g stroke="#18181B" stroke-opacity="0.08">
    <rect x="1210.5" y="234.5" width="301" height="103" rx="21.5"/>
    <rect x="1210.5" y="410.5" width="301" height="103" rx="21.5"/>
    <rect x="1210.5" y="586.5" width="301" height="103" rx="21.5"/>
  </g>

  <!-- Web chat -->
  <rect x="1234" y="262" width="48" height="48" rx="15" fill="#18181B"/>
  <path d="M1246 274H1270V290H1258L1251 296V290H1246V274Z" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="1302" y="272" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">Web chat</text>
  <text x="1302" y="294" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Ask questions with grounded sources</text>
  <text x="1302" y="314" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">and follow the evidence.</text>

  <!-- MCP -->
  <rect x="1234" y="438" width="48" height="48" rx="15" fill="#F1EAFE"/>
  <path d="M1246 454H1254L1258 448L1262 476L1266 454H1274" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1302" y="448" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">MCP server</text>
  <text x="1302" y="470" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Give coding agents secure access</text>
  <text x="1302" y="490" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">to the same intelligence layer.</text>

  <!-- Dashboards -->
  <rect x="1234" y="614" width="48" height="48" rx="15" fill="#FFF0EA"/>
  <path d="M1246 650V638M1258 650V628M1270 650V634" stroke="#EA580C" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M1244 651H1274" stroke="#EA580C" stroke-width="1.8" stroke-linecap="round"/>
  <text x="1302" y="624" fill="#18181B" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">Dashboards &amp; reports</text>
  <text x="1302" y="646" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">Track companies, risks, prospects,</text>
  <text x="1302" y="666" fill="#8A8A93" font-family="Inter, ui-sans-serif, system-ui" font-size="12">and recurring customer themes.</text>

  <text x="800" y="824" text-anchor="middle" fill="#A1A1AA" font-family="Inter, ui-sans-serif, system-ui" font-size="12" font-weight="600" letter-spacing="0.5">BUILT WITH TOGETHER AI · CONVEX · CLERK · NEXT.JS</text>
</svg>
