<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Customer Insights cover</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid;
        place-items: center;
        background: #efeeec;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #17151c;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        isolation: isolate;
        background:
          radial-gradient(circle at 86% 14%, rgba(255, 151, 111, .12), transparent 30%),
          radial-gradient(circle at 64% 82%, rgba(196, 106, 222, .09), transparent 36%),
          radial-gradient(circle at 8% 18%, rgba(130, 108, 226, .10), transparent 34%),
          linear-gradient(135deg, #faf9fb 0%, #fdfcfb 58%, #fcf9f6 100%);
      }
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: .15;
        background-image: radial-gradient(rgba(87, 69, 120, .22) .75px, transparent .75px);
        background-size: 16px 16px;
        mask-image: linear-gradient(90deg, black, transparent 72%);
      }
      .glow {
        position: absolute;
        right: -40px;
        top: 55px;
        width: 680px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255,255,255,.92) 0%, rgba(247,240,249,.34) 44%, rgba(255,255,255,0) 74%);
        filter: blur(14px);
      }
      .network {
        position: absolute;
        right: -42px;
        top: 92px;
        width: 700px;
        opacity: .9;
        filter: saturate(.82) drop-shadow(0 24px 40px rgba(75, 55, 95, .11));
        mask-image: radial-gradient(ellipse 60% 58% at 51% 49%, #000 54%, rgba(0,0,0,.9) 70%, transparent 100%);
      }
      .copy {
        position: relative;
        z-index: 2;
        width: 570px;
        padding: 68px 0 0 72px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -.025em;
      }
      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
        filter: drop-shadow(0 8px 14px rgba(94,65,145,.2));
      }
      h1 {
        margin: 68px 0 0;
        max-width: 560px;
        font-size: 67px;
        line-height: .98;
        letter-spacing: -.065em;
        font-weight: 680;
      }
      h1 span {
        display: block;
        color: transparent;
        background: linear-gradient(90deg, #7946dc 0%, #da3caf 48%, #ff643b 100%);
        background-clip: text;
      }
      .subtitle {
        margin: 28px 0 0;
        max-width: 500px;
        color: #67616e;
        font-size: 20px;
        line-height: 1.48;
        letter-spacing: -.018em;
      }
      .signals {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 42px;
      }
      .signal {
        padding: 9px 13px;
        border: 1px solid rgba(73, 60, 85, .1);
        border-radius: 999px;
        background: rgba(255,255,255,.64);
        box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 5px 15px rgba(68,44,85,.04);
        color: #69616e;
        font-size: 13px;
        font-weight: 600;
      }
      .plus { color: #a79ead; font-size: 15px; }
      .footer {
        position: absolute;
        left: 72px;
        bottom: 40px;
        color: #9c94a1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      @media (min-width: 1800px) and (min-height: 1000px) {
        body { display: block; }
        .stage {
          position: absolute;
          inset: 0 auto auto 0;
          transform: scale(1.6);
          transform-origin: top left;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="glow"></div>
      <img class="network" src="../customer-insights-hero.png" alt="" />
      <section class="copy">
        <div class="brand">
          <img src="../icon.png" alt="" />
          <span>Customer Insights</span>
        </div>
        <h1>Every customer signal.<span>One clear answer.</span></h1>
        <p class="subtitle">Search calls, tickets, Slack, and company context from one private intelligence layer.</p>
        <div class="signals">
          <span class="signal">Web chat</span>
          <span class="plus">+</span>
          <span class="signal">MCP server</span>
          <span class="plus">+</span>
          <span class="signal">Semantic search</span>
        </div>
      </section>
      <div class="footer">Together AI · Convex · Clerk · Next.js</div>
    </main>
  </body>
</html>
